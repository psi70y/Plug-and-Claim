sync:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: plug_and_claim
    days_back:
      default: 14
      selector:
        number:
          min: 1
          max: 3660
          mode: box
          unit_of_measurement: days

set_day:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: plug_and_claim
    date:
      required: true
      selector:
        date:
    kwh:
      required: true
      selector:
        number:
          min: 0
          step: any
          mode: box
          unit_of_measurement: kWh

generate_report:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: plug_and_claim
    month:
      required: true
      example: "2026-09"
      selector:
        text:
    refresh_data:
      default: false
      selector:
        boolean:
    notify:
      selector:
        boolean:
